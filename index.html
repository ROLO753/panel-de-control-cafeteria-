<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafetería La Distingancia | Menú</title>
  <style>
    :root {
      --primary: #ff3b30;
      --primary-dark: #d92817;
      --dark: #1a1a2e;
      --muted: #6b7280;
      --card: rgba(255,255,255,0.98);
      --shadow: 0 18px 40px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, sans-serif; }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, #ff3b30, #d92817);
      box-shadow: 0 8px 32px rgba(255, 59, 48, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; color: white; font-size: 1.1rem; }
    .brand-mark { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: linear-gradient(135deg, #ffd60a, #ffb700); color: #000; }

    .cart-icon { position: relative; cursor: pointer; font-size: 1.8rem; padding: 10px 16px; background: rgba(255,255,255,0.15); border-radius: 12px; color: white; }
    .cart-count { position: absolute; top: -6px; right: -6px; background: #ffd60a; color: #000; font-size: 0.7rem; font-weight: 800; width: 24px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }

    .hero { max-width: 1200px; margin: 0 auto; padding: 40px 20px; text-align: center; color: white; }
    .hero h1 { font-size: 2.5rem; text-transform: uppercase; margin-bottom: 10px; }

    .menu-section { max-width: 1200px; margin: 0 auto; padding: 20px; }
    
    .filter-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
    .chip { border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.8); color: var(--dark); padding: 10px 20px; border-radius: 999px; font-weight: 700; cursor: pointer; }
    .chip.active { background: #ff3b30; color: white; border-color: transparent; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

    .product-card { background: var(--card); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; }
    
    /* ESTILO CUANDO ESTÁ AGOTADO */
    .product-card.agotado { opacity: 0.6; filter: grayscale(40%); }
    .badge-agotado { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

    .product-image { width: 100%; height: 160px; object-fit: cover; background: #e2e8f0; }
    .product-info { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .product-name { font-weight: 800; font-size: 1.05rem; margin-bottom: 8px; }
    .product-price { background: #ff3b30; color: white; display: inline-block; padding: 6px 10px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; margin-bottom: 12px; text-align: center; }

    .add-to-cart-btn { background: #ff3b30; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 800; margin-top: auto; }
    .product-card.agotado .add-to-cart-btn { background: #9ca3af; cursor: not-allowed; }

    /* Modales y Carrito (Mantenidos igual) */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 300; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: white; border-radius: 20px; padding: 30px; max-width: 400px; width: 90%; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; }
    .modal-btn { width: 100%; padding: 12px; background: #34c759; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .cart-panel { position: fixed; right: -400px; top: 0; width: 400px; height: 100vh; background: white; box-shadow: -8px 0 25px rgba(0,0,0,0.15); z-index: 200; display: flex; flex-direction: column; transition: right 0.3s ease; }
    .cart-panel.open { right: 0; }
    .cart-header { background: #ff3b30; color: white; padding: 20px; display: flex; justify-content: space-between; }
    .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
    .cart-footer { padding: 20px; background: #f8fafc; border-top: 2px solid #e2e8f0; }
    .checkout-btn { width: 100%; padding: 14px; background: #34c759; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; display: none; }
    .overlay.active { display: block; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-mark">☕</div>
      <span>Cafetería La Distingancia</span>
    </div>
    <div class="cart-icon" onclick="toggleCart()">🛒<div class="cart-count" id="cart-count" style="display: none;">0</div></div>
  </header>

  <section class="hero">
    <h1>Menú Digital</h1>
    <p>Elige tus productos favoritos</p>
  </section>

  <main class="menu-section">
    <div class="filter-bar">
      <button class="chip active" onclick="filterMenu('all', this)">Todos</button>
      <button class="chip" onclick="filterMenu('sandwich', this)">Sandwiches</button>
      <button class="chip" onclick="filterMenu('picaderas', this)">Picaderas</button>
      <button class="chip" onclick="filterMenu('empanadas', this)">Empanadas</button>
    </div>

    <div class="products-grid" id="products-grid"></div>
  </main>

  <!-- Carrito lateral -->
  <div class="overlay" id="overlay" onclick="toggleCart()"></div>
  <div class="cart-panel" id="cart-panel">
    <div class="cart-header"><h3>Tu Pedido</h3><button onclick="toggleCart()" style="background:none;border:none;color:white;font-size:1.2rem;cursor:pointer">✕</button></div>
    <div class="cart-items" id="cart-items"><p style="text-align:center;color:#6b7280;margin-top:20px;">Tu carrito está vacío</p></div>
    <div class="cart-footer">
      <div style="display:flex;justify-content:space-between;font-weight:bold;margin-bottom:12px;"><span>Total:</span><span id="cart-total">RD$ 0</span></div>
      <button class="checkout-btn" id="checkout-btn" onclick="openCheckout()" disabled>Proceder al Pago ➔</button>
    </div>
  </div>

  <!-- Modal Checkout -->
  <div class="modal-overlay" id="checkout-modal">
    <div class="modal-content">
      <h3>Datos de Envío</h3>
      <div class="form-group" style="margin-top:15px;"><label>Tu Nombre:</label><input type="text" id="client-name" placeholder="Juan Pérez"></div>
      <div class="form-group"><label>Dirección:</label><input type="text" id="client-address" placeholder="Calle / Sector"></div>
      <button class="modal-btn" onclick="sendWhatsAppOrder()">Enviar por WhatsApp</button>
    </div>
  </div>

  <script>
    // Cargar menú sincronizado con localStorage
    const defaultMenu = [
      { id: 1, name: 'Jamón y Queso', price: 125, category: 'sandwich', image: 'https://i.imgur.com/UyTcJUG.jpeg', agotado: false },
      { id: 2, name: 'Salami y Queso', price: 150, category: 'sandwich', image: 'https://via.placeholder.com/200x180?text=Salami+y+Queso', agotado: false },
      { id: 16, name: 'Salami Picadera', minPrice: 150, category: 'picaderas', image: 'https://i.imgur.com/8Se9hg2.jpeg', hasGarnish: true, isVariablePicadera: true, agotado: false },
      { id: 25, name: 'Empanada Pollo y Queso', price: 120, category: 'empanadas', image: 'https://via.placeholder.com/200x180?text=Emp+Pollo+Queso', agotado: false }
    ];

    let cart = [];

    function renderProducts(filter = 'all') {
      const menu = JSON.parse(localStorage.getItem('menu_distingancia')) || defaultMenu;
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      const filtered = filter === 'all' ? menu : menu.filter(p => p.category === filter);

      filtered.forEach(p => {
        const priceText = p.minPrice ? `Desde RD$ ${p.minPrice}` : `RD$ ${p.price}`;
        const badgeAgotado = p.agotado ? `<div class="badge-agotado">AGOTADO</div>` : '';
        const cardClass = p.agotado ? 'product-card agotado' : 'product-card';
        const btnAction = p.agotado ? `disabled style="background:#9ca3af;"` : `onclick="addToCart(${p.id})"`;

        grid.innerHTML += `
          <div class="${cardClass}">
            ${badgeAgotado}
            <img src="${p.image}" class="product-image" alt="${p.name}">
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-price">${priceText}</div>
              <button class="add-to-cart-btn" ${btnAction}>${p.agotado ? 'No disponible' : 'Agregar +'}</button>
            </div>
          </div>
        `;
      });
    }

    function filterMenu(cat, btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(cat);
    }

    function addToCart(id) {
      const menu = JSON.parse(localStorage.getItem('menu_distingancia')) || defaultMenu;
      const product = menu.find(p => p.id === id);
      if (product && !product.agotado) {
        cart.push({ name: product.name, price: product.price || product.minPrice });
        updateCartUI();
      }
    }

    function updateCartUI() {
      const itemsContainer = document.getElementById('cart-items');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');
      const checkoutBtn = document.getElementById('checkout-btn');

      countEl.innerText = cart.length;
      countEl.style.display = cart.length > 0 ? 'flex' : 'none';
      checkoutBtn.disabled = cart.length === 0;

      if (cart.length === 0) {
        itemsContainer.innerHTML = `<p style="text-align:center;color:#6b7280;margin-top:20px;">Tu carrito está vacío</p>`;
        totalEl.innerText = 'RD$ 0';
        return;
      }

      itemsContainer.innerHTML = '';
      let total = 0;
      cart.forEach(item => {
        total += item.price;
        itemsContainer.innerHTML += `<div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:0.95rem;"><span>${item.name}</span><strong>RD$ ${item.price}</strong></div>`;
      });
      totalEl.innerText = `RD$ ${total + 50}`; // Incluyendo delivery
    }

    function toggleCart() {
      document.getElementById('cart-panel').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function openCheckout() {
      toggleCart();
      document.getElementById('checkout-modal').classList.add('active');
    }

    function sendWhatsAppOrder() {
      const name = document.getElementById('client-name').value;
      const address = document.getElementById('client-address').value;
      if (!name || !address) { alert('Completa tu nombre y dirección'); return; }

      let total = cart.reduce((acc, i) => acc + i.price, 0) + 50;
      let detalle = cart.map(i => i.name).join(', ');
      let hora = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Registrar en Panel de Admin
      let pedidos = JSON.parse(localStorage.getItem('pedidos_distingancia')) || [];
      pedidos.unshift({ id: Date.now(), hora, cliente: name, detalle, total: `RD$ ${total}`, estado: 'pendiente' });
      localStorage.setItem('pedidos_distingancia', JSON.stringify(pedidos));

      // WhatsApp
      const numero = "18290000000"; // Tu número
      let msg = `*Pedido - Cafetería La Distingancia*%0A👤 Cliente: ${name}%0A📍 Dirección: ${address}%0A🛒 Detalle: ${detalle}%0A💰 Total: RD$ ${total}`;
      window.open(`https://wa.me/${numero}?text=${msg}`, '_blank');
      cart = [];
      updateCartUI();
      document.getElementById('checkout-modal').classList.remove('active');
    }

    renderProducts();
  </script>
</body>
</html>
